<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Vice RP | Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">VICE <span class="red">RP</span></div>
        <nav>
            <a href="#anasayfa">Ana Sayfa</a>
            <a href="#" onclick="toggleSection('hakkimizda')">Hakkımızda</a>
            <a href="#guncellemeler">Güncellemeler</a>
            <a href="#oyun-indir">Oyun İndir</a>
            <a href="#" class="login-btn">Giriş Yap</a>
        </nav>
    </header>

    <main class="container">
        <!-- Ana Sayfa (Boş/Temiz) -->
        <section id="anasayfa">
            <h1>Vice RP'ye Hoş Geldin</h1>
        </section>

        <!-- Hakkımızda (Açılır Kapanır) -->
        <section id="hakkimizda" class="hidden">
            <div class="card">
                <h2>Sunucumuzun Geçmişi</h2>
                <p>Vice RP, 2021 yılından bu yana kaliteli roleplay vizyonuyla gelişmeye devam eden köklü bir topluluktur.</p>
            </div>
        </section>
    </main>

    <script>
        function toggleSection(id) {
            document.getElementById(id).classList.toggle('hidden');
        }
    </script>
</body>
</html>
