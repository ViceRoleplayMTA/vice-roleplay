<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucu Adı | Minecraft Sunucusu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ================= GENEL AYARLAR ================= */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0b0f19;       
            --bg-darker: #05070f;      
            --card-bg: #111827;        
            --primary-color: #0ea5e9;  
            --primary-hover: #0284c7;
            --text-main: #ffffff;      
            --text-muted: #9ca3af;     
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* ================= NAVIGASYON BAR ================= */
        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--primary-color);
            cursor: pointer;
            user-select: none;
        }

        .logo span {
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .btn-store {
            background-color: var(--primary-hover);
            color: white !important;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-store:hover {
            background-color: var(--primary-color);
        }

        /* ================= ANA SAYFA (HERO) ================= */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .hero h1 span {
            background: linear-gradient(to right, #38bdf8, #0369a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            max-width: 42rem;
            margin-bottom: 2rem;
        }

        /* IP Kopyalama Kutusu */
        .ip-container {
            background-color: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(55, 65, 81, 0.5);
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 28rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .ip-details {
            text-align: left;
        }

        .ip-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .ip-text {
            font-family: monospace;
            font-size: 1.125rem;
            color: var(--primary-color);
            font-weight: 700;
            display: block;
        }

        .btn-copy {
            background-color: var(--primary-hover);
            color: white;
            border: none;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-copy:hover {
            background-color: var(--primary-color);
        }

        .btn-copy:active {
            transform: scale(0.95);
        }

        .toast {
            font-size: 0.875rem;
            color: var(--primary-color);
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        /* Özellikler Bölümü */
        .features-section {
            background-color: var(--bg-darker);
            padding: 5rem 1.5rem;
        }

        .features-section h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid #1f2937;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .card h3 {
            margin-bottom: 0.5rem;
        }
