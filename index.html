<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Vice Roleplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">VICE RP</div>
        <nav>
            <a href="#">Mağaza</a>
            <a href="#">Başvuru</a>
            <a href="#">Discord</a>
        </nav>
        <div class="user-profile">
            <span>Pandix</span>
            <img src="https://ui-avatars.com/api/?name=Pandix&background=ff4757&color=fff" alt="Profil">
        </div>
    </header>

    <div class="container">
        <h1>Vice Roleplay</h1>
        <p>Vice şehri seni bekliyor. Kendi hikayeni yazmaya hazır mısın?</p>
        
        <div class="buttons">
            <a href="https://discord.gg/vicerp" class="btn discord">Discord'a Katıl</a>
        </div>

        <section class="vip-store">
            <h2>VIP Market</h2>
            <div class="vip-grid">
                <div class="vip-card"><img src="1.png" alt="VIP 1"><h3>VIP 1</h3><p>75 TL</p><a href="https://discord.gg/vicerp" class="btn apply">Satın Al</a></div>
                <div class="vip-card"><img src="2.png" alt="VIP 2"><h3>VIP 2</h3><p>100 TL</p><a href="https://discord.gg/vicerp" class="btn apply">Satın Al</a></div>
                <div class="vip-card"><img src="3.png" alt="VIP 3"><h3>VIP 3</h3><p>125 TL</p><a href="https://discord.gg/vicerp" class="btn apply">Satın Al</a></div>
                <div class="vip-card"><img src="4.png" alt="VIP 4"><h3>VIP 4</h3><p>150 TL</p><a href="https://discord.gg/vicerp" class="btn apply">Satın Al</a></div>
                <div class="vip-card"><img src="5.png" alt="VIP ELITE"><h3>VIP ELITE</h3><p>175 TL</p><a href="https://discord.gg/vicerp" class="btn apply">Satın Al</a></div>
            </div>
        </section>
    </div>
</body>
</html>
