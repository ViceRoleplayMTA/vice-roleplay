<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Vice RP | Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-content">
        <header class="top-nav">
            <div class="logo">VICE <span class="v-color">RP</span></div>
            <nav class="nav-links">
                <a href="#hakkimizda">Hakkımızda</a>
                <a href="#guncellemeler">Güncellemeler</a>
                <a href="#oyun-indir">Oyun İndir</a>
                <a href="#" onclick="toggleModal('bakiye-modal')">Bakiye Yükle</a>
                <a href="#" onclick="toggleModal('login-modal')" class="login-btn">Giriş Yap</a>
            </nav>
        </header>

        <section id="hakkimizda" class="about-section">
            <div class="about-content">
                <h2>Hikayemiz ve Vizyonumuz</h2>
                <p>Vice RP, profesyonel MTA:SA deneyimi sunar.</p>
            </div>
        </section>

        <section id="guncellemeler" class="update-section">
            <h2>Sunucu Güncellemeleri</h2>
            <p>En yeni yamalar burada!</p>
        </section>
    </div>

    <!-- Modallar -->
    <div id="login-modal" class="modal-overlay" onclick="toggleModal('login-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Giriş Yap</h2>
            <input type="text" placeholder="Kullanıcı Adı">
            <input type="password" placeholder="Şifre">
            <button class="hero-btn">Giriş Yap</button>
            <p style="margin-top:20px;">Henüz hesabın yok mu? <a href="#" onclick="toggleModal('login-modal'); toggleModal('register-modal')">Hemen Kayıt Ol</a></p>
        </div>
    </div>

    <div id="register-modal" class="modal-overlay" onclick="toggleModal('register-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Kayıt Ol</h2>
            <input type="text" placeholder="E-posta">
            <input type="password" placeholder="Şifre Oluştur">
            <button class="hero-btn">Kayıt Ol</button>
        </div>
    </div>

    <div id="bakiye-modal" class="modal-overlay" onclick="toggleModal('bakiye-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Ödemeler Discord'da</h2>
            <a href="https://discord.gg/vicerp" class="hero-btn">Discord'a Git</a>
        </div>
    </div>

    <script>
        function toggleModal(id) {
            document.getElementById(id).classList.toggle('active');
            document.getElementById('main-content').classList.toggle('blurred');
        }
    </script>
</body>
</html>
